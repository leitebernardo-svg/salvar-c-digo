<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conversão entre tipos string para numéricos</title>
   <script type = "text/javascript">
     var num1 = prompt("digite o primeiro valor: ");
     num1 = parseInt(num1);  
     var num2 =parseInt (prompt("digite o segundo valor"));

     document.write("a soma do valor 1 e o 2 é:" ,num1+num2<br>);
     document.write("a diferença do valor 1 e o 2 é:" ,num1-num2<br>);
     document.write("o produto do valor 1 e o 2 é:" ,num1*num2<br>);
     document.write("o quociente do valor 1 e o 2 é:" ,num1/num2<br>);

    </script>
</head>
<body>
    
</body>
</html>
